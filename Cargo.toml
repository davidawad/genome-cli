[package]
name = "genome-cli"
version = "0.2.0"
edition = "2021"
description = "Personal genomic data (array exports, WGS VCFs, FASTQ) in one genotype model, backed by FrankenSQLite (fsqlite)"
license = "MIT"
repository = "https://gitlab.com/davidawad/genome-cli"
readme = "README.md"
default-run = "genome"

[[bin]]
name = "genome"
path = "src/main.rs"

[lib]
name = "genome_cli"
path = "src/lib.rs"

[dependencies]
fsqlite = { version = "0.4.7", default-features = false, features = ["native"] }
asupersync = { version = "0.5", default-features = false }
clap = { version = "4.5", features = ["derive", "env", "wrap_help", "string"] }
clap_complete = "4.5"
clap_complete_nushell = "4.5"
clap_mangen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
csv = "1.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = "1"
sha2 = "0.10"
md-5 = "0.10"
ureq = "2"
chacha20poly1305 = "0.10"
argon2 = { version = "0.5", features = ["zeroize"] }
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.2"
rpassword = "7"
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
directories = "6"
which = "8"
age = { version = "0.12.1", features = ["ssh"] }
ssh-key = "0.6.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
ssh-key = { version = "0.6.7", features = ["ed25519", "encryption", "getrandom"] }
tempfile = "3"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
strip = "symbols"

[package.metadata.cargo-machete]
# md-5 is imported under its lib name `md5` (src/fetch.rs).
ignored = ["md-5"]
